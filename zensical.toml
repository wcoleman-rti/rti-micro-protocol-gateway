[project]
site_name = "RTI Micro Protocol Gateway"
site_url = "https://wcoleman-rti.github.io/rti-micro-protocol-gateway/"
docs_dir = "build/docs-source"
site_dir = "site"
use_directory_urls = false # Make file:// previews open page files directly.
extra_css = ["docs/assets/rti-brand.css"]
nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "C API guide" = "api-guide.md" },
    { "Build configuration" = "docs/build.md" },
    { "Core contracts" = "docs/core.md" },
    { "Adapter and DDS binding development" = "docs/developing-adapters.md" },
    { "DDS remote control" = "docs/remote-control.md" },
    { "Typed sequences" = "docs/sequences.md" },
    { "Testing" = "docs/testing.md" },
    { "Limitations" = "docs/limitations.md" },
  ] },
  { "Performance" = [
    { "Overview" = "docs/performance.md" },
    { "CAN benchmark" = "docs/can-performance.md" },
    { "DDS benchmark" = "docs/dds-performance.md" },
    { "vcan integration" = "docs/vcan-integration.md" },
  ] },
  { "Resources" = [
    { "CAN adapter README" = "adapters/can/README.md" },
    { "Connext Micro adapter README" = "adapters/dds/connext_micro/README.md" },
    { "DBC code generator README" = "tools/dbc_codegen/README.md" },
  ] },
  { "Examples" = [
    { "CAN / DDS gateway" = "examples/can_dds/README.md" },
  ] },
]

[project.theme]
language = "en"
logo = "docs/assets/rti-logo.png"

[project.theme.font]
text = "Montserrat"
code = "Roboto Mono"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "orange"
